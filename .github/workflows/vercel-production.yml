name: Vercel Production Deployment

on:
  push:
    branches:
      - main

env:
  VERCEL_ORG_ID: team_4JSK3RUTgDOjUqq25GF4DG6e
  VERCEL_PROJECT_ID: prj_WZIYnzocWOsyNykUOeAvkMhxY9mu

jobs:
  deploy-production:
    name: Deploy to Vercel (production)
    runs-on: ubuntu-latest
    steps:
      - name: Require Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not set. Add it under GitHub → Settings → Secrets and variables → Actions."
            echo "See README.md for setup. Site is already live at https://dhanam-driving-school.vercel.app"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
